<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>My RPG Game</title>
  <link rel="stylesheet" href="meniu.css">
  <style>
    /* Fundalul negru din jurul jocului si centrarea lui pe ecran */
    body {
      margin: 0;
      background: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    /* Impiedica telefonul sa faca zoom cand tragi cu degetul peste joc */
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body>

  <!-- ============ ECRANUL DE PORNIRE ============ -->
  <!-- Scrie "Loading..." pana cand se incarca tot. Ultimul fisier
       de la sfarsitul paginii schimba textul in butonul Play, deci
       daca ramane pe Loading inseamna ca ceva chiar n-a ajuns. -->
  <div id="ecran-titlu">
    <div class="cer-titlu"></div>
    <div class="munti-titlu"><span></span><span></span><span></span></div>

    <div class="cuprins-titlu">
      <h1 id="titlu-joc"></h1>
      <div class="linie-titlu"></div>
      <p id="subtitlu-joc"></p>
      <div id="zona-play"><span class="incarcare">Loading...</span></div>
    </div>
  </div>

  <!-- ============ ALEGEREA PERSONAJULUI (3 sloturi) ============ -->
  <div id="ecran-sloturi" class="ascuns">
    <h2 id="titlu-sloturi"></h2>
    <div class="sloturi" id="sloturi"></div>
    <button class="buton" id="inapoi-la-titlu">Back</button>
  </div>

  <!-- ============ ECRANUL DE CREARE A PERSONAJULUI ============ -->
  <div id="ecran-creare" class="ascuns">

    <!-- Scena are marime fixa 1280x720 si se micsoreaza singura ca sa incapa. -->
    <div id="scena">

      <!-- Fundalul: cer, munti, pamant. Desenat din forme, nu din poze. -->
      <div class="fundal">
        <div class="cer"></div>
        <div class="munte m1"></div>
        <div class="munte m2"></div>
        <div class="munte m3"></div>
        <div class="pamant"></div>
      </div>

      <!-- ---------- PANOUL DIN STANGA ---------- -->
      <div class="panou-stanga">

        <div class="steaguri">
          <div class="steag alianta">
            <div class="titlu-steag">Alliance</div>
            <div class="tiles" id="tiles-alianta"></div>
          </div>
          <div class="steag hoarda">
            <div class="titlu-steag">Horde</div>
            <div class="tiles" id="tiles-hoarda"></div>
          </div>
        </div>

        <div class="eticheta-aleasa" id="nume-rasa"></div>

        <div class="titlu-mic" id="titlu-clasa">Class</div>
        <div class="tiles-clase" id="grila-clase"></div>

        <!-- Randurile de infatisare se construiesc din meniu.js,
             dupa listele fiecarei rase. -->
        <div class="infatisare" id="infatisare"></div>

      </div>

      <!-- ---------- MIJLOCUL: PERSONAJUL ---------- -->
      <div class="mijloc">
        <div class="scena-personaj">
          <div class="silueta" id="silueta"></div>
        </div>

        <div class="zona-nume">
          <div class="eticheta-nume">Name</div>
          <input id="nume" type="text" maxlength="12" autocomplete="off"
                 spellcheck="false" placeholder="Character name">
          <button class="buton mic" id="zar">Randomize</button>
          <p id="mesaj-nume"></p>
          <div class="sageti">
            <div class="buton-mort sageata">&#8592;</div>
            <div class="buton-mort sageata">&#8594;</div>
          </div>
        </div>
      </div>

      <!-- ---------- PANOURILE DIN DREAPTA ---------- -->
      <div class="coloana-dreapta">

        <div class="panou">
          <div class="cap-panou">
            <span class="portret" id="portret-rasa"></span>
            <span id="titlu-rasa">Race</span>
          </div>
          <div class="corp-panou" id="corp-rasa"></div>
        </div>

        <div class="panou">
          <div class="cap-panou">
            <span class="portret patrat" id="portret-clasa"></span>
            <span id="titlu-clasa-panou">Class</span>
          </div>
          <div class="corp-panou" id="corp-clasa"></div>
        </div>

        <div class="panou">
          <div class="cap-panou"><span>Stats</span></div>
          <div class="corp-panou" id="blocuri-stats"></div>
        </div>

        <div class="butoane-jos">
          <button class="buton mare" id="intra" disabled>Accept</button>
          <div class="buton-mort lat">Back</div>
        </div>

      </div>

    </div>
  </div>

  <!-- ============ MENIUL DIN JOC (Character / Spells / Talents) ============ -->
  <!-- Sta ascuns pana apesi butonul MENU din joc. -->
  <div id="ecran-meniu" class="ascuns">
    <div id="scena-meniu">

      <div class="cap-meniu">
        <div class="file">
          <button class="fila aleasa" data-fila="character">Character</button>
          <button class="fila" data-fila="spells">Spells</button>
          <button class="fila" data-fila="talents">Talents</button>
          <button class="fila" data-fila="inventory">Inventory</button>
          <button class="fila" data-fila="quests">Quests</button>
        </div>
        <div class="butoane-cap-meniu">
          <button class="buton" id="log-out">Log out</button>
          <button class="buton inchide" id="inchide-meniu">Close</button>
        </div>
      </div>

      <div class="corp-meniu">
        <div class="pagina" id="pagina-character"></div>
        <div class="pagina ascuns" id="pagina-spells"></div>
        <div class="pagina ascuns" id="pagina-talents"></div>
        <div class="pagina ascuns" id="pagina-inventory"></div>
        <div class="pagina ascuns" id="pagina-quests"></div>
      </div>

    </div>
  </div>

  <!-- ============ PRADA SI TARABA NEGUSTORULUI ============ -->
  <!-- Acelasi cadru se foloseste si pentru prada de la inamici,
       si pentru taraba negustorului. -->
  <div id="ecran-fereastra" class="ascuns">
    <div id="scena-fereastra">
      <div class="cap-fereastra">
        <span id="titlu-fereastra"></span>
        <button class="buton inchide" id="inchide-fereastra">Close</button>
      </div>
      <div class="corp-fereastra" id="corp-fereastra"></div>
    </div>
  </div>

  <!-- ============ HARTA LUMII ============ -->
  <!-- Se deschide apasand pe miniharta. Arata cele doua continente
       si toate zonele, cu numele si nivelurile lor. Inamicii NU
       apar pe ea: harta e pentru drum, nu pentru lupta. -->
  <div id="ecran-harta" class="ascuns">
    <div class="cap-harta">
      <select class="alege-harta" id="alege-harta"></select>
      <button class="buton inchide" id="inchide-harta">Close</button>
    </div>
    <div class="corp-harta">
      <div class="plansa-harta" id="plansa-harta"></div>
      <div class="detalii-zona" id="detalii-zona"></div>
    </div>
  </div>

  <!-- ============ INCARCAREA UNEI ZONE ============ -->
  <!-- Se vede cat timp se construieste harta zonei noi. -->
  <div id="ecran-incarcare" class="ascuns">
    <div class="cuprins-incarcare">
      <div class="eticheta-incarcare">Entering</div>
      <h2 id="nume-zonei-noi"></h2>
      <div id="nivel-zonei-noi"></div>
      <div class="bara-incarcare"><span></span></div>
    </div>
  </div>

  <!-- Fisa unui obiect. Se muta sub degetul tau si se arata
       cand tii apasat pe un obiect (sau cand treci cu mouse-ul). -->
  <div id="fisa-obiect" class="ascuns"></div>

  <!-- Cutia cu unelte Phaser, adusa de pe internet -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>

  <!-- Toate cuvintele care se vad in joc, intr-un singur loc -->
  <script src="texte.js"></script>

  <!-- Tabelele cu rase si clase + calculul statisticilor -->
  <script src="personaj.js"></script>

  <!-- Salvarea personajului in telefon -->
  <script src="salvare.js"></script>

  <!-- Talentele: arborii si regulile lor -->
  <script src="talente.js"></script>

  <!-- Abilitatile: toate cifrele lor stau intr-un singur fisier. -->
  <script src="abilitati.js"></script>

  <!-- Meseriile: trepte, noduri, materiale. -->
  <script src="meserii.js"></script>
  <script src="retete.js"></script>

  <!-- Banii: arama, argint, aur -->
  <script src="bani.js"></script>

  <!-- Obiectele, sloturile de echipament si ce lasa inamicii -->
  <script src="obiecte.js"></script>

  <!-- Cum arata personajul: o singura lista de forme, folosita
       si de joc, si de meniu -->
  <script src="infatisare.js"></script>

  <!-- Felurile de inamici: cum arata si ce statistici au -->
  <script src="mobi.js"></script>

  <!-- Misiunile: ce ai de facut si ce primesti -->
  <script src="misiuni.js"></script>

  <!-- Personajele prietenoase (NPC) -->
  <script src="npc.js"></script>

  <!-- Zonele. Harta NU se mai tine scrisa: fiecare fisier e o
       reteta de cateva zeci de randuri, iar harta se construieste
       cand intri in zona. -->
  <script src="zone/climat.js"></script>
  <script src="zone/generator.js"></script>
  <script src="zone/lista-zone.js"></script>
  <script src="zone/zona-gravemoor.js"></script>
  <script src="zone/zona-hollowmere.js"></script>
  <script src="zone/zona-duskvale.js"></script>
  <script src="zone/zona-sablewood.js"></script>
  <script src="zone/zona-direhold.js"></script>
  <script src="zone/zona-thornmoor.js"></script>
  <script src="zone/zona-ravensreach.js"></script>
  <script src="zone/zona-greyfen.js"></script>
  <script src="zone/zona-ashenmoor.js"></script>
  <script src="zone/zona-thornspire.js"></script>
  <script src="zone/zona-greenvale.js"></script>
  <script src="zone/zona-mistwood.js"></script>
  <script src="zone/zona-stormhollow.js"></script>
  <script src="zone/zona-blackfen.js"></script>
  <script src="zone/zona-cinderpeak.js"></script>
  <script src="zone/zona-bramblewatch.js"></script>
  <script src="zone/zona-ironhill.js"></script>
  <script src="zone/zona-gravehold.js"></script>
  <script src="zone/zona-ashenreach.js"></script>
  <script src="zone/zona-emberwastes.js"></script>
  <script src="zone/zona-silverbough.js"></script>
  <script src="zone/zona-palewood.js"></script>
  <script src="zone/zona-sunspire.js"></script>
  <script src="zone/zona-windscour.js"></script>
  <script src="zone/zona-palereach.js"></script>
  <script src="zone/zona-dustplain.js"></script>
  <script src="zone/zona-stonecall.js"></script>
  <script src="zone/zona-shatterhorn.js"></script>
  <script src="zone/zona-emberdune.js"></script>
  <script src="zone/zona-coldspine.js"></script>
  <script src="zone/zona-redwaste.js"></script>
  <script src="zone/zona-saltcliff.js"></script>
  <script src="zone/zona-verdantmire.js"></script>
  <script src="zone/zona-glasswastes.js"></script>
  <script src="zone/zona-riftmarch.js"></script>
  <script src="zone/zona-duneholt.js"></script>
  <script src="zone/zona-longsteppe.js"></script>
  <script src="zone/zona-bonemarch.js"></script>
  <script src="zone/zona-hollowroot.js"></script>
  <script src="zone/zona-sundercrag.js"></script>

  <!-- Orasele principale. Au harta lor, separata de a zonelor. -->
  <script src="zone/oras-ambervault.js"></script>
  <script src="zone/oras-karrakhold.js"></script>

  <!-- Misiunile scrise de mana, zona cu zona. Se incarca PRIMELE:
       orice zona care are misiuni scrise nu mai primeste si de-alea
       facute dupa tipare. -->
  <script src="misiuni-scrise.js"></script>

  <!-- Misiunile facute dupa tipare, pentru zonele fara povesti scrise -->
  <script src="misiuni-zone.js"></script>

  <!-- Acum ca s-au inregistrat toate, le legam intre ele si le dam
       misiuni zonelor care n-au. -->
  <script>
    leagaZonele();
    faMisiunileTuturorZonelor();
  </script>

  <!-- Jocul (asteapta sa fie pornit din meniu) -->
  <script src="game.js"></script>

  <!-- Meniul de creare (porneste jocul cand apesi "Accept") -->
  <script src="meniu.js"></script>

  <!-- Harta lumii -->
  <script src="harta.js"></script>

  <!-- Ecranul de pornire si alegerea personajului.
       Se incarca ULTIMUL: daca a ajuns pana aici, s-a incarcat tot. -->
  <script src="titlu.js"></script>

  <!-- Meniul din joc: Character, Spells, Talents -->
  <script src="meniu-joc.js"></script>

  <!-- Prada de la inamici si taraba negustorului -->
  <script src="prada.js"></script>

</body>
</html>
