<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World of Emberfall — 3D</title>

  <!-- The title screen, the three save slots and the character
       creation screen are the 2D game's own, unchanged: same file,
       same stylesheet, same markup. Only what happens AFTER you
       press Accept is different. -->
  <link rel="stylesheet" href="../meniu.css">

  <style>
    html, body { margin: 0; height: 100%; background: #0a0d10; overflow: hidden;
                 font-family: Georgia, "Palatino Linotype", "Times New Roman", serif; }
    canvas { display: block; }

    /* The thin bar along the top of the 3D world. */
    #bara {
      position: fixed; left: 0; right: 0; top: 0; z-index: 5;
      display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
      padding: 8px 14px; color: #e8dcc0; font-size: 13px;
      background: rgba(20, 16, 12, 0.88); border-bottom: 1px solid #8a6a2f;
    }
    #bara.ascuns { display: none; }
    #bara b { color: #d9b555; font-weight: normal; }
    #bara select {
      font-family: inherit; font-size: 13px; padding: 3px 6px;
      color: #e8dcc0; background: #241c12; border: 1px solid #8a6a2f;
    }
    #taste { color: #a08a63; }

    /* Shown while a zone is being built. */
    #stare {
      position: fixed; inset: 0; z-index: 10; display: flex;
      align-items: center; justify-content: center; text-align: center;
      color: #e8dcc0; font-size: 17px; background: #0a0d10;
    }
    #stare.gata { display: none; }

    /* ---- the combat panels: your health, your target ---- */
    /* Sits below the top bar. How tall that bar is depends on how
       the text wraps, so its height is measured and set from
       lupta3d.js rather than guessed at here - guessing it put the
       target's name behind the bar, where it could not be read. */
    #panouri { position: fixed; left: 0; right: 0; bottom: 0; top: 0;
               pointer-events: none; z-index: 4; }
    /* A frame is a portrait and, beside it, the bars. Both halves sit
       on a raised panel: two inset shadows do the whole job of making
       it look like a plate of metal rather than a rectangle of CSS. */
    .panou-lupta {
      position: absolute; width: 238px; padding: 6px 8px;
      display: flex; gap: 8px; align-items: center;
      background: linear-gradient(180deg, rgba(38,30,21,0.94), rgba(16,12,8,0.94));
      border: 1px solid #8a6a2f; border-radius: 3px;
      box-shadow: inset 0 1px 0 rgba(255,235,190,0.16),
                  inset 0 -1px 0 rgba(0,0,0,0.5),
                  0 2px 6px rgba(0,0,0,0.45);
      color: #e8dcc0; font-size: 12px;
    }
    .panou-lupta.ascuns { display: none; }
    .panou-lupta .cifrele { flex: 1; min-width: 0; }

    .panou-lupta .portret {
      position: relative; width: 46px; height: 46px; flex: none; overflow: hidden;
      background: radial-gradient(circle at 40% 30%, #3b3222, #120d08 70%);
      border: 1px solid #8a6a2f; border-radius: 3px;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.75);
    }
    /* htmlSilueta() draws you at its own size and its own origin:
       measured, the whole figure lands between x 19-241 and y 34-316.
       A portrait wants the head and shoulders, so this frames the
       120x116 box at the top of that and shrinks it to fit. Measured
       rather than guessed - guessed, the box came out empty. */
    .panou-lupta .portret .inauntru {
      position: absolute; left: 0; top: 0; width: 260px; height: 340px;
      transform: scale(0.38) translate(-72px, -32px); transform-origin: 0 0;
    }
    #panou-tinta .portret .inauntru {
      transform: none; left: 3px; top: 3px; width: 40px; height: 40px;
    }

    /* How hard your target is, in the colours the world map already
       uses for zones that are over your head. */
    #panou-tinta.greu      { border-color: #b8534a; }
    #panou-tinta.cam-greu  { border-color: #c9a83f; }
    #panou-tinta.usor      { border-color: #6b7f8f; }
    /* Your frame, and the thing you are fighting immediately to the
       right of it. They belong side by side: in a fight you are
       reading both bars at once, and a target frame parked in the
       middle of the screen made that two separate glances.
       A ROW, so that widening a frame can never make them overlap. */
    #randul-panourilor {
      position: absolute; left: 14px; top: 8px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    #randul-panourilor .panou-lupta { position: static; }
    .nume-lupta { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .nume-lupta span:first-child { color: #d9b555; }
    .nume-lupta span:last-child { color: #a08a63; font-size: 11px; }
    /* A groove with something filling it. The dark inset at the top
       and the pale one at the bottom are what make it read as cut
       INTO the panel rather than laid on top of it. */
    .sant {
      position: relative; height: 15px; margin-bottom: 3px;
      background: linear-gradient(180deg, #060500, #14100a);
      border: 1px solid #241b0e; border-radius: 2px; overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    }
    .sant.subtire { height: 6px; margin-top: 3px; margin-bottom: 0; }
    .sant span {
      position: relative;
      display: block; height: 100%; text-align: center; font-size: 10px;
      line-height: 15px; color: #f2e8d0; white-space: nowrap;
      text-shadow: 0 1px 1px rgba(0,0,0,0.9);
      transition: width 0.12s linear;
    }
    /* One band of light across the top of whatever is in the groove,
       so a full bar looks rounded instead of painted flat. */
    .sant span::after {
      content: ''; position: absolute; inset: 0 0 50% 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
      pointer-events: none;
    }
    /* Tied to .sant on purpose: these are the fills INSIDE a bar's
       groove. Left loose, '.xp' also painted the experience line in
       the quest window purple, right across the panel. */
    .sant .viata { background: linear-gradient(180deg, #67a541, #2f5a1c); }
    .sant .viata.rosu { background: linear-gradient(180deg, #b64236, #6b1f19); }
    .sant .xp { background: linear-gradient(180deg, #8a67c4, #462f70); }
    .sant .mana { background: linear-gradient(180deg, #4a83d4, #1d3c72); }

    /* ---- the action bar and the cast bar ----
       Every border, every glow and every icon below is drawn here
       out of colours and shapes. Nothing is a picture from anywhere. */
    #interfata { position: fixed; inset: 0; pointer-events: none; z-index: 6; }

    /* The bar sits on a plate with a lit top edge and a dark bottom
       one - the whole trick to making flat CSS look like a thing
       bolted onto the screen. */
    #bara-actiuni {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px; padding: 6px 7px 7px;
      background: linear-gradient(180deg, rgba(44,35,24,0.95), rgba(14,11,7,0.95));
      border: 1px solid #6b5326; border-radius: 4px; pointer-events: auto;
      box-shadow: inset 0 1px 0 rgba(255,235,190,0.18),
                  inset 0 -1px 0 rgba(0,0,0,0.6),
                  0 3px 10px rgba(0,0,0,0.5);
    }

    /* A button is three layers: a dark socket, a raised rim, and the
       picture sunk into it. */
    #bara-actiuni .slot {
      position: relative; width: 42px; height: 42px; cursor: pointer;
      background: #0b0805; border-radius: 3px;
      box-shadow: 0 0 0 1px #12100c,
                  0 0 0 2px #7a5f2c,
                  inset 0 0 5px rgba(0,0,0,0.9);
      transition: box-shadow 0.08s linear;
    }
    #bara-actiuni .slot:hover {
      box-shadow: 0 0 0 1px #12100c,
                  0 0 0 2px #e8c96a,
                  0 0 9px rgba(232,201,106,0.45),
                  inset 0 0 5px rgba(0,0,0,0.9);
    }
    #bara-actiuni .slot.gol {
      box-shadow: 0 0 0 1px #12100c, 0 0 0 2px #3a2e17, inset 0 0 6px rgba(0,0,0,0.95);
      cursor: default;
    }
    #bara-actiuni .slot.gol:hover {
      box-shadow: 0 0 0 1px #12100c, 0 0 0 2px #3a2e17, inset 0 0 6px rgba(0,0,0,0.95);
    }
    #bara-actiuni .icoana {
      position: absolute; inset: 2px; border-radius: 2px; overflow: hidden;
    }
    /* dims when you cannot afford it */
    #bara-actiuni .slot.sarac .icoana { filter: grayscale(0.85) brightness(0.45); }

    /* The weapon, while you are swinging: a light that breathes. */
    #bara-actiuni .slot.atacul.pornit {
      box-shadow: 0 0 0 1px #12100c, 0 0 0 2px #ffd34d,
                  0 0 12px rgba(255,211,77,0.6), inset 0 0 5px rgba(0,0,0,0.9);
      animation: pulsul-atacului 1.1s ease-in-out infinite;
    }
    @keyframes pulsul-atacului {
      0%, 100% { filter: brightness(1); }
      50%      { filter: brightness(1.35); }
    }

    /* THE COOLDOWN IS A CLOCK HAND, not a curtain.
       A wedge of shadow that sweeps round as the time runs out - one
       conic gradient, no pictures and no script beyond setting the
       angle. A curtain sliding down tells you how much is left but
       not how fast it is coming; a hand tells you both. */
    #bara-actiuni .perdea {
      position: absolute; inset: 2px; border-radius: 2px; pointer-events: none;
      --sweep: 0deg;
      background: conic-gradient(from 0deg,
                  rgba(8,6,4,0.72) var(--sweep), rgba(0,0,0,0) 0);
    }
    #bara-actiuni .secunde {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 18px; color: #ffe3a3;
      text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000;
      pointer-events: none;
    }
    /* Top right, where a keybind goes. */
    #bara-actiuni .tasta {
      position: absolute; right: 3px; top: 1px; font-size: 10px;
      color: #e3d3aa; pointer-events: none;
      text-shadow: 0 0 2px #000, 0 0 2px #000, 0 1px 1px #000;
    }

    #incantare {
      position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%);
      width: 260px; height: 19px; border-radius: 2px;
      background: linear-gradient(180deg, #060500, #14100a);
      border: 1px solid #8a6a2f;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 2px 6px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    #incantare.ascuns { display: none; }
    #incantare-plina {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(180deg, #e8b850, #9a6d1c);
    }
    #incantare-nume {
      position: absolute; inset: 0; text-align: center; line-height: 19px;
      font-size: 11px; color: #f7efdc; text-shadow: 0 1px 2px #000, 0 0 3px #000;
    }

    #fisa-abilitate {
      position: absolute; width: 230px; padding: 9px 11px; border-radius: 3px;
      background: linear-gradient(180deg, rgba(26,21,14,0.97), rgba(10,8,5,0.97));
      border: 1px solid #8a6a2f;
      box-shadow: inset 0 1px 0 rgba(255,235,190,0.12), 0 4px 12px rgba(0,0,0,0.55);
      color: #e8dcc0; font-size: 11px; line-height: 1.45;
    }
    #fisa-abilitate.ascuns { display: none; }
    #fisa-abilitate b { display: block; color: #d9b555; font-size: 12px; font-weight: normal; }
    #fisa-abilitate i { display: block; color: #a08a63; font-style: normal; margin: 2px 0 5px; }
    #fisa-abilitate p { margin: 0; color: #cbbfa4; }

    .sant .rage { background: linear-gradient(180deg, #c04a34, #6e2114); }

    /* ---- the loot sack and the bag ---- */
    #fereastra3d {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 330px; max-height: 76vh; z-index: 8; display: flex; flex-direction: column;
      background: rgba(14, 11, 8, 0.96); border: 1px solid #8a6a2f;
      color: #e8dcc0; font-size: 12px;
    }
    #fereastra3d.ascuns { display: none; }
    #fereastra3d .cap {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; border-bottom: 1px solid #6b5326; color: #d9b555;
    }
    #fereastra3d .cap button {
      font-family: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer;
      color: #e8dcc0; background: #241c12; border: 1px solid #8a6a2f;
    }
    #fereastra3d .corp { padding: 8px 10px; overflow-y: auto; }
    #fereastra3d .rand {
      display: flex; align-items: center; gap: 8px; padding: 4px;
      cursor: pointer; border: 1px solid transparent;
    }
    #fereastra3d .rand:hover { border-color: #8a6a2f; background: rgba(138,106,47,0.12); }
    #fereastra3d .ic { width: 30px; height: 30px; flex: none; border: 1px solid #4b3a1c; }
    #fereastra3d .gol { color: #7c6c50; font-style: italic; }
    #fereastra3d #ia-tot {
      width: 100%; margin-top: 8px; padding: 5px; cursor: pointer;
      font-family: inherit; font-size: 12px;
      color: #e8dcc0; background: #241c12; border: 1px solid #8a6a2f;
    }
    #fereastra3d .grila {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
    }
    #fereastra3d .cutiuta {
      aspect-ratio: 1; background: #120e0a; border: 1px solid #4b3a1c; cursor: pointer;
    }
    #fereastra3d .cutiuta:hover { border-color: #d9b555; }
    #fereastra3d .cutiuta.gol { cursor: default; border-color: #2a2113; }
    #fereastra3d .purtate { margin-top: 10px; border-top: 1px solid #4b3a1c; padding-top: 8px; }
    #fereastra3d .purtate b { color: #d9b555; font-weight: normal; }

    /* ---- talking to people: quests and the stall ---- */
    #fereastra3d h3 { margin: 0 0 6px; color: #d9b555; font-size: 13px; font-weight: normal; }
    #fereastra3d .povestea { margin: 0 0 8px; color: #cbbfa4; line-height: 1.5; }
    #fereastra3d .cerinta { margin: 0 0 8px; color: #e8dcc0; }
    #fereastra3d .cerinta b { color: #d9b555; font-weight: normal; }
    #fereastra3d .rasplata { margin: 8px 0; border-top: 1px solid #4b3a1c; padding-top: 6px; }
    #fereastra3d .rasplata b { color: #d9b555; font-weight: normal; }
    #fereastra3d .mic { margin: 5px 0 3px; color: #a08a63; font-size: 11px; }
    #fereastra3d .rasplata .bani,
    #fereastra3d .rasplata .xp { margin-top: 3px; color: #cbbfa4; }
    #fereastra3d .alegere.aleasa { border-color: #d9b555; background: rgba(217,181,85,0.14); }
    #fereastra3d .misiune .semn { width: 16px; text-align: center; color: #ffd34d; font-size: 15px; }
    #fereastra3d .misiune.activa .semn { color: #a08a63; }
    #fereastra3d .misiune .text { flex: 1; }
    #fereastra3d .lista { margin-bottom: 8px; }
    #fereastra3d .pret { margin-left: auto; white-space: nowrap; font-size: 11px; }
    #fereastra3d .mesaj {
      margin: 0 0 8px; padding: 4px 6px; color: #ffe3a3;
      background: rgba(138,106,47,0.18); border: 1px solid #6b5326;
    }
    #fereastra3d button.lat {
      width: 100%; margin-top: 8px; padding: 5px; cursor: pointer;
      font-family: inherit; font-size: 12px;
      color: #e8dcc0; background: #241c12; border: 1px solid #8a6a2f;
    }
    #fereastra3d button.lat:hover { border-color: #d9b555; }
    #fereastra3d button.inapoi { background: #1a1510; color: #a08a63; }

    /* ---- the talent trees ---- */
    #fereastra3d.lat { width: 720px; }
    #fereastra3d .arbori { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    #fereastra3d .arbore { border: 1px solid #4b3a1c; padding: 5px; }
    #fereastra3d .cap-arbore {
      color: #d9b555; text-align: center; padding-bottom: 4px;
      border-bottom: 1px solid #4b3a1c; margin-bottom: 5px;
    }
    #fereastra3d .cap-arbore span { color: #a08a63; }
    #fereastra3d .treapta { position: relative; display: grid; gap: 4px; margin-bottom: 5px; }
    #fereastra3d .treapta.inchisa { opacity: 0.4; }
    #fereastra3d .lacat {
      position: absolute; right: 2px; top: -2px; font-size: 10px; color: #8a6a2f;
    }
    #fereastra3d .talent {
      padding: 4px 5px; background: #120e0a; border: 1px solid #332814; cursor: default;
    }
    #fereastra3d .talent.poti { cursor: pointer; border-color: #6b5326; }
    #fereastra3d .talent.poti:hover { border-color: #d9b555; background: rgba(138,106,47,0.14); }
    #fereastra3d .talent.luat { border-color: #4a7c2f; }
    #fereastra3d .nume-talent { color: #e8dcc0; }
    #fereastra3d .rang { float: right; color: #d9b555; font-size: 11px; }
    #fereastra3d .ce-face { color: #a08a63; font-size: 11px; line-height: 1.35; }

    /* ---- trades ---- */
    #fereastra3d .meserie.aleasa { border-color: #d9b555; background: rgba(217,181,85,0.12); }
    #fereastra3d .retete { margin-top: 8px; border-top: 1px solid #4b3a1c; padding-top: 6px; }
    #fereastra3d .reteta { opacity: 0.55; }
    #fereastra3d .reteta.poti { opacity: 1; }

    #fereastra3d .zbor { opacity: 0.5; }
    #fereastra3d .zbor.poti { opacity: 1; }
    #fereastra3d .mic-zona { color: #7c6c50; font-size: 11px; }







    /* ==========================================================
         THE MAP CORNER, top right.  See 3d/harta3d.js.
       ========================================================== */
    #coltul-hartii {
      position: fixed; right: 14px; top: 8px; z-index: 5;
      width: 152px; text-align: center; color: #e8dcc0; font-size: 11px;
    }
    #coltul-hartii .nume-locului {
      padding: 3px 4px; background: rgba(20, 16, 12, 0.88);
      border: 1px solid #8a6a2f; border-bottom: none;
      color: #d9b555; font-size: 12px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    #coltul-hartii .rama-hartii {
      position: relative; border: 1px solid #8a6a2f; background: #07090b;
      line-height: 0; cursor: pointer;
    }
    #coltul-hartii canvas { display: block; }
    #coltul-hartii .nord {
      position: absolute; left: 4px; top: 2px; line-height: 1;
      font-size: 11px; color: #f2e8d0; text-shadow: 0 0 3px #000, 0 0 3px #000;
    }
    #coltul-hartii .lupa {
      position: absolute; right: 2px; bottom: 2px; display: flex; gap: 2px;
    }
    #coltul-hartii .lupa button {
      width: 18px; height: 18px; padding: 0; line-height: 1; cursor: pointer;
      font-family: inherit; font-size: 12px;
      color: #e8dcc0; background: rgba(20, 16, 12, 0.85); border: 1px solid #6b5326;
    }
    #coltul-hartii .lupa button:hover { border-color: #d9b555; }
    #coltul-hartii .sub-harta {
      padding: 2px 4px; background: rgba(20, 16, 12, 0.88);
      border: 1px solid #8a6a2f; border-top: none; color: #a08a63;
    }

    /* ==========================================================
         THE QUEST ARROW, top middle.  See 3d/busola3d.js.
       ========================================================== */
    #busola {
      position: fixed; left: 50%; transform: translateX(-50%); top: 8px;
      z-index: 5; display: flex; align-items: center; gap: 9px;
      padding: 5px 12px; cursor: pointer; max-width: 42vw;
      background: rgba(20, 16, 12, 0.82); border: 1px solid #6b5326;
      color: #e8dcc0; font-size: 12px;
    }
    #busola.ascuns { display: none; }
    #busola:hover { border-color: #d9b555; }
    #busola .ac { width: 26px; height: 26px; flex: none; transition: transform 0.12s linear; }
    #busola .scrisul { text-align: left; min-width: 0; }
    #busola .misiunea {
      color: #ffd34d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #busola .departe { color: #a08a63; font-size: 11px; }

    /* ==========================================================
         THE MENU CORNER, bottom right.  See 3d/meniu3d.js.
       ========================================================== */
    #meniu-colt {
      position: fixed; right: 14px; bottom: 16px; z-index: 7;
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    }
    #meniu-colt .genti { display: flex; gap: 4px; }
    #meniu-colt .geanta {
      position: relative; width: 34px; height: 34px; cursor: pointer;
      background: #120e0a; border: 1px solid #6b5326;
    }
    #meniu-colt .geanta:hover { border-color: #d9b555; }
    #meniu-colt .geanta .semn { position: absolute; inset: 5px; opacity: 0.9; }
    #meniu-colt .geanta .libere {
      position: absolute; right: 1px; bottom: 0; font-size: 10px;
      color: #ffe3a3; text-shadow: 0 0 2px #000, 0 0 2px #000;
    }
    #meniu-colt .geanta .libere.plin { color: #ff8a7a; }
    #meniu-colt .geanta.goala {
      background: #0e0b07; border-color: #332814; cursor: default;
    }
    #meniu-colt .butonase { display: flex; gap: 3px; }
    #meniu-colt .butonas {
      width: 28px; height: 28px; padding: 4px; cursor: pointer; line-height: 0;
      background: rgba(16, 13, 9, 0.85); border: 1px solid #6b5326;
    }
    #meniu-colt .butonas:hover { border-color: #d9b555; background: rgba(138,106,47,0.2); }
    /* The action bar is centred on the window and the twelve of them
       are 595 pixels wide. On a narrow screen the corner would sit on
       top of the last few buttons, so it steps up out of the way. */
    @media (max-width: 1100px) { #meniu-colt { bottom: 74px; } }

    /* ---- the pages those buttons open ---- */
    #fereastra3d .doua-coloane {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-items: start;
    }
    #fereastra3d .cutie {
      border: 1px solid #4b3a1c; padding: 6px 8px; margin-bottom: 8px;
    }
    #fereastra3d .cutie h3 { margin: 0 0 5px; }
    #fereastra3d .rand-cifra {
      display: flex; justify-content: space-between; gap: 10px; padding: 1px 0;

    #fereastra3d .treapta-poza {
      flex: 1; padding: 4px 6px; cursor: pointer; white-space: nowrap;

    #fereastra3d .treapta-poza.aleasa { border-color: #d9b555; background: rgba(217,181,85,0.18); }

    /* ==========================================================
         THE BOX THAT COMES UP WHEN YOU ARE A SPIRIT.
         See 3d/moarte3d.js.
       ========================================================== */
    #cutia-mortii {
      position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
      z-index: 8; width: 280px; padding: 12px 14px; text-align: center;
      background: linear-gradient(180deg, rgba(38,24,21,0.95), rgba(14,9,8,0.95));
      border: 1px solid #8a4a3f; border-radius: 3px;
      box-shadow: inset 0 1px 0 rgba(255,200,190,0.14), 0 4px 14px rgba(0,0,0,0.6);
      color: #e8dcc0; font-size: 12px;
    }
    #cutia-mortii.ascuns { display: none; }
    #cutia-mortii .titlu-mortii {
      color: #e0776a; font-size: 16px; margin-bottom: 4px;
    }
    #cutia-mortii .scrisul-mortii { color: #cbbfa4; margin-bottom: 9px; }
    #cutia-mortii button {
      width: 100%; padding: 6px; cursor: pointer;
      font-family: inherit; font-size: 12px;
      color: #e8dcc0; background: #2e1c18; border: 1px solid #8a4a3f; border-radius: 2px;
    }
    #cutia-mortii button:hover { border-color: #e0a090; }
    #cutia-mortii .nota-mortii { margin-top: 5px; color: #a08a63; font-size: 11px; }

    #stare .mic { display: block; margin-top: 10px; font-size: 13px; color: #a08a63; }
</style>

<body>

  <!-- ============ ECRANUL DE PORNIRE ============ -->
  <!-- Scrie "Loading..." pana cand se incarca tot. Ultimul fisier
       de la sfarsitul paginii schimba textul in butonul Play, deci
       daca ramane pe Loading inseamna ca ceva chiar n-a ajuns. -->
  <div id="ecran-titlu">
    <div class="cer-titlu"></div>
    <div class="munti-titlu"><span></span><span></span><span></span></div>

    <div class="cuprins-titlu">
      <h1 id="titlu-joc"></h1>
      <div class="linie-titlu"></div>
      <p id="subtitlu-joc"></p>
      <div id="zona-play"><span class="incarcare">Loading...</span></div>
    </div>
  </div>

  <!-- ============ ALEGEREA PERSONAJULUI (3 sloturi) ============ -->
  <div id="ecran-sloturi" class="ascuns">
    <h2 id="titlu-sloturi"></h2>
    <div class="sloturi" id="sloturi"></div>
    <button class="buton" id="inapoi-la-titlu">Back</button>
  </div>

  <!-- ============ ECRANUL DE CREARE A PERSONAJULUI ============ -->
  <div id="ecran-creare" class="ascuns">

    <!-- Scena are marime fixa 1280x720 si se micsoreaza singura ca sa incapa. -->
    <div id="scena">

      <!-- Fundalul: cer, munti, pamant. Desenat din forme, nu din poze. -->
      <div class="fundal">
        <div class="cer"></div>
        <div class="munte m1"></div>
        <div class="munte m2"></div>
        <div class="munte m3"></div>
        <div class="pamant"></div>
      </div>

      <!-- ---------- PANOUL DIN STANGA ---------- -->
      <div class="panou-stanga">

        <div class="steaguri">
          <div class="steag alianta">
            <div class="titlu-steag">Concord</div>
            <div class="tiles" id="tiles-alianta"></div>
          </div>
          <div class="steag hoarda">
            <div class="titlu-steag">Pact</div>
            <div class="tiles" id="tiles-hoarda"></div>
          </div>
        </div>

        <div class="eticheta-aleasa" id="nume-rasa"></div>

        <div class="titlu-mic" id="titlu-clasa">Class</div>
        <div class="tiles-clase" id="grila-clase"></div>

        <!-- Randurile de infatisare se construiesc din meniu.js,
             dupa listele fiecarei rase. -->
        <div class="infatisare" id="infatisare"></div>

      </div>

      <!-- ---------- MIJLOCUL: PERSONAJUL ---------- -->
      <div class="mijloc">
        <div class="scena-personaj">
          <div class="silueta" id="silueta"></div>
        </div>

        <div class="zona-nume">
          <div class="eticheta-nume">Name</div>
          <input id="nume" type="text" maxlength="12" autocomplete="off"
                 spellcheck="false" placeholder="Character name">
          <button class="buton mic" id="zar">Randomize</button>
          <p id="mesaj-nume"></p>
          <div class="sageti">
            <div class="buton-mort sageata">&#8592;</div>
            <div class="buton-mort sageata">&#8594;</div>
          </div>
        </div>
      </div>

      <!-- ---------- PANOURILE DIN DREAPTA ---------- -->
      <div class="coloana-dreapta">

        <div class="panou">
          <div class="cap-panou">
            <span class="portret" id="portret-rasa"></span>
            <span id="titlu-rasa">Race</span>
          </div>
          <div class="corp-panou" id="corp-rasa"></div>
        </div>

        <div class="panou">
          <div class="cap-panou">
            <span class="portret patrat" id="portret-clasa"></span>
            <span id="titlu-clasa-panou">Class</span>
          </div>
          <div class="corp-panou" id="corp-clasa"></div>
        </div>

        <div class="panou">
          <div class="cap-panou"><span>Stats</span></div>
          <div class="corp-panou" id="blocuri-stats"></div>
        </div>

        <div class="butoane-jos">
          <button class="buton mare" id="intra" disabled>Accept</button>
          <div class="buton-mort lat">Back</div>
        </div>

      </div>

    </div>
  </div>

  <!-- ============ THE 3D WORLD ============ -->
  <div id="bara" class="ascuns">
    <span><b>Zone</b> <select id="alege-zona"></select></span>
    <span id="unde"></span>
    <span><b>Picture</b> <span id="treapta-pixeli">2&times; chunky</span></span>
    <span id="taste">Escape &mdash; the menu and how to play</span>
  </div>

  <div id="stare" class="gata"></div>

  <!-- ============ THE WORLD MAP ============
       The same screen the 2D game has, drawn by the same harta.js.
       The markup has to be here before that file loads, because it
       finds these four by name the moment it runs. -->
  <div id="ecran-harta" class="ascuns">
    <div class="cap-harta">
      <select class="alege-harta" id="alege-harta"></select>
      <button class="buton inchide" id="inchide-harta">Close</button>
    </div>
    <div class="corp-harta">
      <div class="plansa-harta" id="plansa-harta"></div>
      <div class="detalii-zona" id="detalii-zona"></div>
    </div>
  </div>
