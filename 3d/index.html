<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World of Emberfall — 3D</title>

  <!-- The title screen, the three save slots and the character
       creation screen are the 2D game's own, unchanged: same file,
       same stylesheet, same markup. Only what happens AFTER you
       press Accept is different. -->
  <link rel="stylesheet" href="../meniu.css">

  <style>
    html, body { margin: 0; height: 100%; background: #0a0d10; overflow: hidden;
                 font-family: Georgia, "Palatino Linotype", "Times New Roman", serif; }
    canvas { display: block; }

    /* The thin bar along the top of the 3D world. */
    #bara {
      position: fixed; left: 0; right: 0; top: 0; z-index: 5;
      display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
      padding: 8px 14px; color: #e8dcc0; font-size: 13px;
      background: rgba(20, 16, 12, 0.88); border-bottom: 1px solid #8a6a2f;
    }
    #bara.ascuns { display: none; }
    #bara b { color: #d9b555; font-weight: normal; }
    #bara select {
      font-family: inherit; font-size: 13px; padding: 3px 6px;
      color: #e8dcc0; background: #241c12; border: 1px solid #8a6a2f;
    }
    #taste { color: #a08a63; }

    /* Shown while a zone is being built. */
    #stare {
      position: fixed; inset: 0; z-index: 10; display: flex;
      align-items: center; justify-content: center; text-align: center;
      color: #e8dcc0; font-size: 17px; background: #0a0d10;
    }
    #stare.gata { display: none; }

    /* ---- the combat panels: your health, your target ---- */
    /* Sits below the top bar. How tall that bar is depends on how
       the text wraps, so its height is measured and set from
       lupta3d.js rather than guessed at here - guessing it put the
       target's name behind the bar, where it could not be read. */
    #panouri { position: fixed; left: 0; right: 0; bottom: 0; top: 0;
               pointer-events: none; z-index: 4; }
    .panou-lupta {
      position: absolute; width: 230px; padding: 7px 9px;
      background: rgba(20, 16, 12, 0.86); border: 1px solid #8a6a2f;
      color: #e8dcc0; font-size: 12px;
    }
    .panou-lupta.ascuns { display: none; }
    #panou-tau   { left: 14px; top: 8px; }
    #panou-tinta { left: 50%; transform: translateX(-50%); top: 8px; }
    .nume-lupta { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .nume-lupta span:first-child { color: #d9b555; }
    .nume-lupta span:last-child { color: #a08a63; font-size: 11px; }
    .sant {
      position: relative; height: 15px; background: #0d0a06;
      border: 1px solid #2e2311; overflow: hidden;
    }
    .sant.subtire { height: 7px; margin-top: 4px; }
    .sant span {
      display: block; height: 100%; text-align: center; font-size: 10px;
      line-height: 15px; color: #f2e8d0; white-space: nowrap;
      transition: width 0.12s linear;
    }
    .viata { background: #4a7c2f; }
    .viata.rosu { background: #8c2f27; }
    .xp { background: #6a4b9c; }

    #stare .mic { display: block; margin-top: 10px; font-size: 13px; color: #a08a63; }
  </style>
</head>
<body>

  <!-- ============ ECRANUL DE PORNIRE ============ -->
  <!-- Scrie "Loading..." pana cand se incarca tot. Ultimul fisier
       de la sfarsitul paginii schimba textul in butonul Play, deci
       daca ramane pe Loading inseamna ca ceva chiar n-a ajuns. -->
  <div id="ecran-titlu">
    <div class="cer-titlu"></div>
    <div class="munti-titlu"><span></span><span></span><span></span></div>

    <div class="cuprins-titlu">
      <h1 id="titlu-joc"></h1>
      <div class="linie-titlu"></div>
      <p id="subtitlu-joc"></p>
      <div id="zona-play"><span class="incarcare">Loading...</span></div>
    </div>
  </div>

  <!-- ============ ALEGEREA PERSONAJULUI (3 sloturi) ============ -->
  <div id="ecran-sloturi" class="ascuns">
    <h2 id="titlu-sloturi"></h2>
    <div class="sloturi" id="sloturi"></div>
    <button class="buton" id="inapoi-la-titlu">Back</button>
  </div>

  <!-- ============ ECRANUL DE CREARE A PERSONAJULUI ============ -->
  <div id="ecran-creare" class="ascuns">

    <!-- Scena are marime fixa 1280x720 si se micsoreaza singura ca sa incapa. -->
    <div id="scena">

      <!-- Fundalul: cer, munti, pamant. Desenat din forme, nu din poze. -->
      <div class="fundal">
        <div class="cer"></div>
        <div class="munte m1"></div>
        <div class="munte m2"></div>
        <div class="munte m3"></div>
        <div class="pamant"></div>
      </div>

      <!-- ---------- PANOUL DIN STANGA ---------- -->
      <div class="panou-stanga">

        <div class="steaguri">
          <div class="steag alianta">
            <div class="titlu-steag">Concord</div>
            <div class="tiles" id="tiles-alianta"></div>
          </div>
          <div class="steag hoarda">
            <div class="titlu-steag">Pact</div>
            <div class="tiles" id="tiles-hoarda"></div>
          </div>
        </div>

        <div class="eticheta-aleasa" id="nume-rasa"></div>

        <div class="titlu-mic" id="titlu-clasa">Class</div>
        <div class="tiles-clase" id="grila-clase"></div>

        <!-- Randurile de infatisare se construiesc din meniu.js,
             dupa listele fiecarei rase. -->
        <div class="infatisare" id="infatisare"></div>

      </div>

      <!-- ---------- MIJLOCUL: PERSONAJUL ---------- -->
      <div class="mijloc">
        <div class="scena-personaj">
          <div class="silueta" id="silueta"></div>
        </div>

        <div class="zona-nume">
          <div class="eticheta-nume">Name</div>
          <input id="nume" type="text" maxlength="12" autocomplete="off"
                 spellcheck="false" placeholder="Character name">
          <button class="buton mic" id="zar">Randomize</button>
          <p id="mesaj-nume"></p>
          <div class="sageti">
            <div class="buton-mort sageata">&#8592;</div>
            <div class="buton-mort sageata">&#8594;</div>
          </div>
        </div>
      </div>

      <!-- ---------- PANOURILE DIN DREAPTA ---------- -->
      <div class="coloana-dreapta">

        <div class="panou">
          <div class="cap-panou">
            <span class="portret" id="portret-rasa"></span>
            <span id="titlu-rasa">Race</span>
          </div>
          <div class="corp-panou" id="corp-rasa"></div>
        </div>

        <div class="panou">
          <div class="cap-panou">
            <span class="portret patrat" id="portret-clasa"></span>
            <span id="titlu-clasa-panou">Class</span>
          </div>
          <div class="corp-panou" id="corp-clasa"></div>
        </div>

        <div class="panou">
          <div class="cap-panou"><span>Stats</span></div>
          <div class="corp-panou" id="blocuri-stats"></div>
        </div>

        <div class="butoane-jos">
          <button class="buton mare" id="intra" disabled>Accept</button>
          <div class="buton-mort lat">Back</div>
        </div>

      </div>

    </div>
  </div>

  <!-- ============ THE 3D WORLD ============ -->
  <div id="bara" class="ascuns">
    <span><b>Zone</b> <select id="alege-zona"></select></span>
    <span id="unde"></span>
    <span><b>P</b> <span id="treapta-pixeli">3&times; chunky</span></span>
    <span id="taste">W S &mdash; walk &nbsp;&middot;&nbsp; A D &mdash; turn &nbsp;&middot;&nbsp; Q E &mdash; step sideways &nbsp;&middot;&nbsp; drag the mouse &mdash; look around &nbsp;&middot;&nbsp; scroll &mdash; closer or further</span>
  </div>

  <div id="stare" class="gata"></div>

  <!-- Three.js: the toolbox that draws 3D in a browser page, the way
       Phaser draws the 2D game. Fetched from the internet like Phaser
       is, so there is nothing to install. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- ====== THE 2D GAME'S OWN FILES, UNCHANGED ======
       Every rule, every item, every quest, every zone. The 3D world
       is built by calling the same faZona() with the same seed, so it
       IS the 2D world, seen from a different angle. -->
  <script src="../texte.js"></script>
  <script src="../personaj.js"></script>
  <script src="../talente.js"></script>
  <script src="../abilitati.js"></script>
  <script src="../meserii.js"></script>
  <script src="../retete.js"></script>
  <script src="../lupta.js"></script>
  <script src="../bani.js"></script>
  <script src="../obiecte.js"></script>
  <script src="../seturi.js"></script>
  <script src="../drumuri.js"></script>
  <script src="../icoane.js"></script>
  <script src="../infatisare.js"></script>
  <script src="../mobi.js"></script>
  <script src="../tovarasi.js"></script>
  <script src="../amenintare.js"></script>
  <script src="../misiuni.js"></script>
  <script src="../npc.js"></script>
  <script src="../zone/climat.js"></script>
  <script src="../zone/generator.js"></script>
  <script src="../zone/lista-zone.js"></script>
  <script src="../zone/zona-gravemoor.js"></script>
  <script src="../zone/zona-hollowmere.js"></script>
  <script src="../zone/zona-duskvale.js"></script>
  <script src="../zone/zona-sablewood.js"></script>
  <script src="../zone/zona-direhold.js"></script>
  <script src="../zone/zona-thornmoor.js"></script>
  <script src="../zone/zona-ravensreach.js"></script>
  <script src="../zone/zona-greyfen.js"></script>
  <script src="../zone/zona-ashenmoor.js"></script>
  <script src="../zone/zona-thornspire.js"></script>
  <script src="../zone/zona-greenvale.js"></script>
  <script src="../zone/zona-mistwood.js"></script>
  <script src="../zone/zona-stormhollow.js"></script>
  <script src="../zone/zona-blackfen.js"></script>
  <script src="../zone/zona-cinderpeak.js"></script>
  <script src="../zone/zona-bramblewatch.js"></script>
  <script src="../zone/zona-ironhill.js"></script>
  <script src="../zone/zona-gravehold.js"></script>
  <script src="../zone/zona-ashenreach.js"></script>
  <script src="../zone/zona-emberwastes.js"></script>
  <script src="../zone/zona-silverbough.js"></script>
  <script src="../zone/zona-palewood.js"></script>
  <script src="../zone/zona-sunspire.js"></script>
  <script src="../zone/zona-windscour.js"></script>
  <script src="../zone/zona-palereach.js"></script>
  <script src="../zone/zona-dustplain.js"></script>
  <script src="../zone/zona-stonecall.js"></script>
  <script src="../zone/zona-shatterhorn.js"></script>
  <script src="../zone/zona-emberdune.js"></script>
  <script src="../zone/zona-coldspine.js"></script>
  <script src="../zone/zona-redwaste.js"></script>
  <script src="../zone/zona-saltcliff.js"></script>
  <script src="../zone/zona-verdantmire.js"></script>
  <script src="../zone/zona-glasswastes.js"></script>
  <script src="../zone/zona-riftmarch.js"></script>
  <script src="../zone/zona-duneholt.js"></script>
  <script src="../zone/zona-longsteppe.js"></script>
  <script src="../zone/zona-bonemarch.js"></script>
  <script src="../zone/zona-hollowroot.js"></script>
  <script src="../zone/zona-sundercrag.js"></script>
  <script src="../zone/temnita-moorhollow.js"></script>
  <script src="../zone/temnita-greyfendepths.js"></script>
  <script src="../zone/temnita-ironhillshafts.js"></script>
  <script src="../zone/temnita-gravehollow.js"></script>
  <script src="../zone/temnita-glasswastepit.js"></script>
  <script src="../zone/temnita-hollowrootwarren.js"></script>
  <script src="../zone/temnita-coldspinevault.js"></script>
  <script src="../zone/temnita-thornspirehold.js"></script>
  <script src="../zone/raid-longaccount.js"></script>
  <script src="../zone/zona-quietcoast.js"></script>
  <script src="../zone/oras-ambervault.js"></script>
  <script src="../zone/oras-karrakhold.js"></script>
  <script src="../misiuni-scrise.js"></script>
  <script src="../misiuni-clasa.js"></script>
  <script src="../misiuni-temnite.js"></script>
  <script src="../misiuni-final.js"></script>
  <script src="../misiuni-zone.js"></script>

  <!-- Now that every zone and every quest has registered itself,
       link them up - exactly as the 2D page does. -->
  <script>
    leagaZonele();
    faMisiunileTuturorZonelor();
  </script>

  <!-- Fills in the dungeon and raid encounters. -->
  <script src="../intalniri-instante.js"></script>

  <!-- Saving, the title screen, the three slots, and character
       creation. All four are the 2D game's files, untouched. The only
       thing they need from us is a function called porneste(), and
       prototip.js below provides a 3D one. -->
  <script src="../salvare.js"></script>
  <script src="../meniu.js"></script>

  <!-- The 3D world. Before titlu.js, because titlu.js is what turns
       "Loading..." into the Play button - if it runs and something
       below it is broken, the screen would lie about being ready. -->
  <script src="prototip.js"></script>

  <!-- Things that are alive: wandering, chasing, hitting, dying.
       Uses the real formulas out of lupta.js and mobi.js. -->
  <script src="lupta3d.js"></script>

  <script src="../titlu.js"></script>

</body>
</html>
